<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City of Truth Ministries</title>
    
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Mukta+Malar:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Noto+Serif+Tamil:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Deferred Device Fingerprinting (non-blocking) -->
    <script type="module">
      const initThumbmark = () => {
        import('https://cdn.jsdelivr.net/npm/@thumbmarkjs/thumbmarkjs/dist/thumbmark.umd.js')
          .then(() => {
            if (window.ThumbmarkJS && window.ThumbmarkJS.Thumbmark) {
              const tm = new window.ThumbmarkJS.Thumbmark({ api_key: '5fba97741a00b8ee87056ddeda3987fb' });
              tm.get().then((result) => {
                window.thumbmarkResult = result;
                if (result) {
                  try {
                    localStorage.setItem('cot_thumbmark_fingerprint', JSON.stringify(result));
                  } catch (e) {}
                }
              }).catch(() => {});
            }
          })
          .catch(() => {});
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(initThumbmark, { timeout: 3000 });
      } else {
        setTimeout(initThumbmark, 2000);
      }
    </script>
    
    <style>
      @font-face {
        font-family: 'Bamini_25';
        src: url('/fonts/Bamini_Tamil_25.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Bamini_03';
        src: url('/fonts/Bamini_Tamil_03.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      /* Automatic Tamil Unicode Font Fallback for all Tamil text */
      .font-tamil, [lang="ta"] {
        font-family: 'Mukta Malar', 'Noto Sans Tamil', 'Catamaran', sans-serif !important;
      }
      .font-tamil-serif {
        font-family: 'Noto Serif Tamil', serif !important;
      }

      body {
        margin: 0;
        font-family: 'Inter', 'Mukta Malar', 'Noto Sans Tamil', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #05040a;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes gold-shimmer {
        0%   { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .gold-shimmer-title {
        background-image: linear-gradient(
          100deg,
          #ffffff 0%,
          #fff8d6 18%,
          #fde68a 36%,
          #ffffff 50%,
          #fde68a 64%,
          #fff8d6 82%,
          #ffffff 100%
        ) !important;
        background-size: 200% auto !important;
        animation: gold-shimmer 4s linear infinite;
        will-change: background-position;
        transform: translateZ(0);
      }
      .pure-gold-text {
        background-image: linear-gradient(
          100deg,
          #ffffff 0%,
          #fff8d6 18%,
          #fde68a 36%,
          #ffffff 50%,
          #fde68a 64%,
          #fff8d6 82%,
          #ffffff 100%
        ) !important;
        background-size: 200% auto !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
        color: transparent !important;
        filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.8)) drop-shadow(0px 4px 16px rgba(251, 191, 36, 0.45));
        font-weight: 900;
        animation: gold-shimmer 4s linear infinite;
        will-change: background-position;
        transform: translateZ(0);
      }
      body.lightbox-open nav {
        opacity: 0 !important;
        pointer-events: none !important;
      }
      /* Custom style for thin admin menu scrollbar */
      .admin-menu-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .admin-menu-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .admin-menu-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .admin-menu-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .admin-menu-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
